name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (no game or controller)
        run: python -m unittest discover -s tests -v
      - name: Native read-only exporter test (macOS only)
        if: runner.os == 'macOS'
        env:
          RUN_EXPORTER_TESTS: '1'
        run: python -m unittest discover -s tests -p test_exporter_macos.py -v
      - name: Check public source archive
        run: python tools/package_release.py --output dist/source.zip
